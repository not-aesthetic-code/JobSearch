[project]
name = "jobsearch"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.30.0",
    "crawl4ai>=0.8.6",
    "fastapi>=0.136.1",
    "httpx>=0.28.0",
    "openai>=2.37.0",
    "pgvector>=0.4.0",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
select = ["E", "F", "I", "UP", "B"]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobsearch"]
